schema: spec-driven

context: |
  - Write all OpenSpec artifacts (proposal, specs, design, tasks) in English.
  - Walleto is a personal finance web app built as a portfolio project. One OpenSpec change per MVP, in the order listed in WORKPLAN.md.
  - Stack: Django 5.2 LTS with server-rendered templates, Tailwind CSS v4, HTMX and Alpine.js for interactivity, ApexCharts for charts. SQLite in development, PostgreSQL in production. OpenAI API for AI features. No separate JavaScript frontend framework.
  - UI copy is English only. Light mode only; never add dark mode. All UI must follow docs/STYLE.md (tokens, components, copy rules).
  - Money is Indonesian Rupiah with no decimals. Store amounts as integers or Decimal, never float. Display format is defined in docs/STYLE.md (e.g. Rp847.500).
  - Numbers are always computed by code or the database, never by an LLM. An LLM may only interpret user intent, choose tools, and explain results that code has computed. Any LLM output that changes data must be validated by code and confirmed by the user before it is saved.
  - Every query on user data is scoped to the logged-in user. A user must never be able to read or change another user's data, including by guessing IDs in URLs.
  - Keep tasks small and concrete enough to implement without further breakdown.
  - After a change is implemented, add a `changes.md` next to its proposal: commits, routes, every file created or modified with what it does, differences from the plan, verification done, and open items before archiving.
  - Every commit adds one record in `openspec/commits/` (in the same commit), following the template and rules in `openspec/commits/README.md`, and updates the index there.

rules:
  proposal:
    - State what is out of scope for this MVP.
  specs:
    - Describe observable behavior only; library and framework choices belong in design.md.
  design:
    - Record decisions with the alternative that was rejected and why.
  tasks:
    - Each task should take at most about two hours.
    - Every change includes tasks for automated tests of its core logic, including a test that one user cannot access another user's data when the change adds user data.
    - Every change ends with a task to update docs/decisions.md and to run openspec validate.
